<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RéflexeSport">
    <meta name="theme-color" content="#050810">
    <title>RéflexeSport iPhone — Entraînement Réflexes Visuels & Podium Top 3</title>
    <style>
        :root {
            --bg-950: #050810;
            --bg-900: #0b1120;
            --bg-850: #11192e;
            --bg-800: #17223d;
            --border-700: #243356;
            --text-100: #f8fafc;
            --text-300: #cbd5e1;
            --text-400: #94a3b8;
            --text-500: #64748b;
            --emerald-400: #34d399;
            --volt-400: #a3e635;
            --cyan-400: #22d3ee;
            --amber-300: #fcd34d;
            --amber-400: #fbbf24;
            --amber-500: #f59e0b;
            --red-400: #f87171;
            --red-500: #ef4444;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: var(--bg-950);
            color: var(--text-100);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
            font-variant-numeric: tabular-nums;
        }

        button, select, input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }

        .hidden {
            display: none !important;
        }

        .app-shell {
            max-width: 500px;
            margin: 0 auto;
            height: 100dvh;
            padding: calc(8px + var(--safe-top)) 12px calc(10px + var(--safe-bottom));
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .app-header {
            background: var(--bg-900);
            border: 1px solid var(--border-700);
            border-radius: 15px;
            padding: 7px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--emerald-400), var(--cyan-400));
            color: #050810;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-podium-trigger {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 10px;
            border-radius: 11px;
            font-size: 0.78rem;
            font-weight: 800;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.24), rgba(245, 158, 11, 0.12));
            border: 1px solid rgba(251, 191, 36, 0.6);
            color: var(--amber-300);
            white-space: nowrap;
        }

        .podium-count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 19px;
            height: 19px;
            padding: 0 5px;
            border-radius: 999px;
            background: var(--amber-400);
            color: #050810;
            font-size: 0.7rem;
            font-weight: 900;
        }

        .btn-sound {
            width: 34px;
            height: 34px;
            border-radius: 11px;
            background: var(--bg-850);
            border: 1px solid var(--border-700);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
        }

        .modes-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            flex-shrink: 0;
        }

        .mode-card {
            text-align: center;
            padding: 7px 4px;
            border-radius: 12px;
            background: var(--bg-900);
            border: 1px solid var(--border-700);
            transition: all 0.15s ease;
        }

        .mode-card.active {
            background: linear-gradient(145deg, var(--bg-850), var(--bg-800));
            border-color: var(--emerald-400);
            box-shadow: 0 4px 14px rgba(52, 211, 153, 0.18);
        }

        .mode-num {
            display: block;
            font-size: 0.64rem;
            font-weight: 900;
            color: var(--emerald-400);
            margin-bottom: 1px;
        }

        .mode-card-title {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--text-100);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .config-panel {
            background: var(--bg-900);
            border: 1px solid var(--border-700);
            border-radius: 14px;
            padding: 7px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .config-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .pill-group {
            display: inline-flex;
            background: var(--bg-950);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--border-700);
            gap: 2px;
            flex: 1;
        }

        .pill-btn {
            flex: 1;
            padding: 5px 4px;
            border-radius: 7px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-400);
            text-align: center;
            white-space: nowrap;
        }

        .pill-btn.active-emerald {
            background: var(--emerald-400);
            color: #050810;
            font-weight: 800;
        }

        .pill-btn.active-cyan {
            background: var(--cyan-400);
            color: #050810;
            font-weight: 800;
        }

        .select-field {
            background: var(--bg-950);
            border: 1px solid var(--border-700);
            color: var(--text-100);
            font-size: 0.74rem;
            font-weight: 800;
            padding: 5px 8px;
            border-radius: 9px;
            outline: none;
        }

        .kpi-strip {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            flex-shrink: 0;
        }

        .kpi-mini {
            background: var(--bg-900);
            border: 1px solid var(--border-700);
            border-radius: 11px;
            padding: 6px 4px;
            text-align: center;
        }

        .kpi-mini-lbl {
            font-size: 0.58rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-400);
        }

        .kpi-mini-val {
            font-size: 0.88rem;
            font-weight: 900;
            margin-top: 1px;
        }

        .arena-wrapper {
            flex: 1;
            min-height: 0;
            background: var(--bg-900);
            border: 1px solid var(--border-700);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .arena-topbar {
            padding: 7px 12px;
            background: var(--bg-850);
            border-bottom: 1px solid var(--border-700);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .arena-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-500);
        }

        .arena-stage {
            flex: 1;
            min-height: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            background-image:
                linear-gradient(to right, rgba(36, 51, 86, 0.22) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(36, 51, 86, 0.22) 1px, transparent 1px);
            background-size: 26px 26px;
        }

        .arena-stage.waiting-red { background-color: rgba(239, 68, 68, 0.16); }
        .arena-stage.go-green { background-color: rgba(52, 211, 153, 0.16); }

        @keyframes popIn {
            0% { transform: scale(0.76); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .circle-wait {
            width: 124px;
            height: 124px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.22);
            border: 3px solid var(--red-500);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fecaca;
            font-weight: 900;
        }

        .circle-go {
            width: 136px;
            height: 136px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald-400), var(--volt-400));
            border: 3px solid #ffffff;
            color: #050810;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            box-shadow: 0 0 34px rgba(52, 211, 153, 0.65);
            animation: popIn 0.14s ease-out;
        }

        .stroop-stimulus-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: popIn 0.14s ease-out;
        }

        .stroop-rule-tag {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(34, 211, 238, 0.14);
            border: 1px solid rgba(34, 211, 238, 0.4);
            color: var(--cyan-400);
        }

        .stroop-rule-tag.inverted {
            background: rgba(251, 191, 36, 0.16);
            border-color: rgba(251, 191, 36, 0.45);
            color: var(--amber-300);
        }

        .stroop-word-display {
            font-size: clamp(2rem, 8.5vw, 3rem);
            font-weight: 900;
            text-transform: uppercase;
            padding: 10px 24px;
            border-radius: 16px;
            background: rgba(5, 8, 16, 0.92);
            border: 1px solid var(--border-700);
        }

        .stroop-arrow-display {
            width: 96px;
            height: 96px;
            border-radius: 20px;
            background: rgba(5, 8, 16, 0.92);
            border: 2px solid var(--border-700);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
            font-weight: 900;
        }

        .stroop-controls-bar {
            padding: 8px 10px;
            background: var(--bg-850);
            border-top: 1px solid var(--border-700);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            flex-shrink: 0;
        }

        .stroop-choice-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 46px;
            border-radius: 12px;
            background: var(--bg-900);
            border: 1px solid var(--border-700);
            font-weight: 800;
            font-size: 0.9rem;
        }

        .stroop-choice-btn:active:not(:disabled) {
            transform: scale(0.96);
            border-color: var(--cyan-400);
            background: var(--bg-800);
        }

        .stroop-choice-btn:disabled {
            opacity: 0.4;
        }

        .periph-grid {
            display: grid;
            gap: 6px;
            width: min(100%, 34dvh);
            aspect-ratio: 1 / 1;
            position: relative;
        }

        .periph-cell {
            border-radius: 10px;
            background: rgba(5, 8, 16, 0.78);
            border: 1px solid var(--border-700);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .periph-target {
            width: 100%;
            height: 100%;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--emerald-400), var(--cyan-400));
            border: 2px solid #ffffff;
            color: #050810;
            font-weight: 900;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(52, 211, 153, 0.55);
            animation: popIn 0.12s ease-out;
        }

        .periph-fixation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1.5px solid rgba(34, 211, 238, 0.65);
            background: rgba(5, 8, 16, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 15;
        }

        .periph-fixation::after {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--cyan-400);
        }

        .btn-start, .btn-stop {
            width: 100%;
            height: 46px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--emerald-400), var(--volt-400));
            color: #050810;
            box-shadow: 0 6px 18px rgba(52, 211, 153, 0.28);
        }

        .btn-stop {
            background: var(--red-500);
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.3);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(3, 6, 14, 0.86);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 12px 12px calc(14px + var(--safe-bottom));
        }

        .modal-window {
            background: var(--bg-900);
            border: 1px solid var(--border-700);
            border-radius: 22px;
            width: 100%;
            max-width: 500px;
            max-height: 88dvh;
            overflow-y: auto;
            padding: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 1.12rem;
            font-weight: 900;
        }

        .modal-subtitle {
            font-size: 0.75rem;
            color: var(--text-400);
            margin-top: 2px;
        }

        .modal-close-btn {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: var(--bg-850);
            border: 1px solid var(--border-700);
            color: var(--text-300);
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .new-record-banner {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.22), rgba(52, 211, 153, 0.14));
            border: 1px solid rgba(251, 191, 36, 0.6);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .new-record-title {
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--amber-300);
        }

        .new-record-desc {
            font-size: 0.74rem;
            color: var(--text-300);
            margin-top: 2px;
        }

        .record-form-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .text-input {
            flex: 1;
            min-width: 0;
            background: var(--bg-950);
            border: 1px solid var(--border-700);
            border-radius: 11px;
            padding: 9px 12px;
            color: var(--text-100);
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .btn-gold {
            padding: 9px 14px;
            border-radius: 11px;
            font-size: 0.78rem;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--amber-300), var(--amber-500));
            color: #050810;
            flex-shrink: 0;
        }

        .podium-selectors {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .podium-tabs-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px;
            background: var(--bg-950);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--border-700);
        }

        .podium-stage {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            align-items: end;
            padding-top: 6px;
            margin-bottom: 12px;
        }

        .podium-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .podium-player-info {
            width: 100%;
            padding-bottom: 6px;
        }

        .podium-medal { font-size: 1.2rem; display: block; }
        .podium-medal.first { font-size: 1.45rem; }

        .podium-name {
            font-size: 0.78rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .podium-name.gold { color: var(--amber-300); font-size: 0.86rem; }
        .podium-metric { font-size: 0.7rem; font-weight: 800; color: var(--text-300); }

        .podium-step {
            width: 100%;
            border-radius: 13px 13px 5px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 2px solid;
            border-left: 1px solid;
            border-right: 1px solid;
        }

        .podium-step.rank-1 {
            height: 86px;
            background: linear-gradient(180deg, rgba(251, 191, 36, 0.28), rgba(217, 119, 6, 0.08));
            border-color: rgba(251, 191, 36, 0.65);
        }

        .podium-step.rank-2 {
            height: 66px;
            background: linear-gradient(180deg, rgba(203, 213, 225, 0.2), rgba(100, 116, 139, 0.07));
            border-color: rgba(203, 213, 225, 0.5);
        }

        .podium-step.rank-3 {
            height: 54px;
            background: linear-gradient(180deg, rgba(217, 119, 6, 0.22), rgba(146, 64, 14, 0.08));
            border-color: rgba(245, 158, 11, 0.48);
        }

        .step-num { font-size: 1.25rem; font-weight: 900; }
        .step-label { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; }

        .podium-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .podium-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 11px;
            background: var(--bg-950);
            border: 1px solid var(--border-700);
            font-size: 0.78rem;
        }

        .podium-row.empty { border-style: dashed; color: var(--text-500); }
        .podium-row-left { display: flex; align-items: center; gap: 8px; min-width: 0; }

        .rank-pill {
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .rank-pill.r1 { background: rgba(251, 191, 36, 0.16); color: var(--amber-300); border: 1px solid rgba(251, 191, 36, 0.4); }
        .rank-pill.r2 { background: rgba(203, 213, 225, 0.14); color: #e2e8f0; border: 1px solid rgba(203, 213, 225, 0.35); }
        .rank-pill.r3 { background: rgba(217, 119, 6, 0.16); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }

        .btn-icon-edit {
            padding: 5px 8px;
            border-radius: 8px;
            background: var(--bg-850);
            border: 1px solid var(--border-700);
            color: var(--text-300);
            font-size: 0.72rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .podium-footer-bar {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-700);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .btn-reset-cat {
            padding: 7px 10px;
            border-radius: 9px;
            font-size: 0.72rem;
            font-weight: 700;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .btn-secondary {
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            background: var(--bg-850);
            border: 1px solid var(--border-700);
            color: var(--text-300);
        }

        .summary-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin: 12px 0;
        }

        .summary-stat-box {
            background: var(--bg-950);
            border: 1px solid var(--border-700);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
        }

        .modal-actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo" aria-hidden="true">⚡</div>

    <script>
        let soundEnabled = true;
        let audioCtx = null;

        function ensureAudio() {
            if (!soundEnabled) return null;
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) audioCtx = new Ctx();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playTone({ freq = 660, endFreq = null, duration = 0.08, type = 'sine', gain = 0.12 }) {
            const ctx = ensureAudio();
            if (!ctx) return;
            try {
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (endFreq !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), now + duration);
                g.gain.setValueAtTime(0.0001, now);
                g.gain.linearRampToValueAtTime(gain, now + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.connect(g);
                g.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.02);
            } catch (e) {}
        }

        const SFX = {
            start: () => {
                playTone({ freq: 523.25, duration: 0.07, type: 'triangle', gain: 0.1 });
                setTimeout(() => playTone({ freq: 783.99, duration: 0.1, type: 'triangle', gain: 0.11 }), 85);
            },
            stimulus: () => playTone({ freq: 880, endFreq: 1060, duration: 0.075, type: 'triangle', gain: 0.12 }),
            hit: () => playTone({ freq: 640, endFreq: 960, duration: 0.065, type: 'sine', gain: 0.11 }),
            error: () => playTone({ freq: 210, endFreq: 130, duration: 0.19, type: 'sawtooth', gain: 0.12 }),
            fanfare: () => {
                playTone({ freq: 523.25, duration: 0.09, type: 'triangle', gain: 0.12 });
                setTimeout(() => playTone({ freq: 659.25, duration: 0.09, type: 'triangle', gain: 0.12 }), 95);
                setTimeout(() => playTone({ freq: 783.99, duration: 0.11, type: 'triangle', gain: 0.12 }), 190);
                setTimeout(() => playTone({ freq: 1046.5, duration: 0.24, type: 'triangle', gain: 0.15 }), 295);
            }
        };

        function toggleSound() {
            soundEnabled = !soundEnabled;
            if (soundEnabled) { ensureAudio(); SFX.hit(); }
            document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
        }

        const MODE_LABELS = {
            reaction: 'Vitesse de Réaction',
            stroop: 'Stroop & Décision Cognitive',
            peripheral: 'Vision Périphérique'
        };

        const DIFF_CONFIG = {
            debutant: { label: 'Débutant', minWait: 1100, maxWait: 2300, reactionTimeout: 2500, stroopTimeout: 2800, invertArrowProb: 0.25, periphGrid: 3, periphSpawnMs: 1300, periphLifeMs: 2150, periphMulti: 1 },
            athlete:  { label: 'Athlète',  minWait: 700,  maxWait: 1800, reactionTimeout: 1850, stroopTimeout: 2100, invertArrowProb: 0.45, periphGrid: 4, periphSpawnMs: 950,  periphLifeMs: 1600, periphMulti: 2 },
            pro:      { label: 'Pro',      minWait: 450,  maxWait: 1300, reactionTimeout: 1350, stroopTimeout: 1550, invertArrowProb: 0.65, periphGrid: 5, periphSpawnMs: 680,  periphLifeMs: 1150, periphMulti: 3 }
        };

        const STROOP_COLORS = [
            { id: 'red', label: 'ROUGE', btnLabel: 'Rouge', hex: '#ef4444' },
            { id: 'blue', label: 'BLEU', btnLabel: 'Bleu', hex: '#3b82f6' },
            { id: 'green', label: 'VERT', btnLabel: 'Vert', hex: '#22c55e' },
            { id: 'yellow', label: 'JAUNE', btnLabel: 'Jaune', hex: '#eab308' }
        ];

        const STROOP_ARROWS = [
            { id: 'left', label: 'Gauche', symbol: '←' },
            { id: 'up', label: 'Haut', symbol: '↑' },
            { id: 'down', label: 'Bas', symbol: '↓' },
            { id: 'right', label: 'Droite', symbol: '→' }
        ];

        const state = {
            mode: 'reaction',
            difficulty: 'athlete',
            sessionFormat: 'targets',
            sessionAmount: 15,
            stroopSubMode: 'color',
            isRunning: false,
            phase: 'idle',
            completedHits: 0,
            elapsedSeconds: 0,
            sessionStartedAt: 0,
            stimulusShownAt: 0,
            expectedAnswerId: null,
            reactionTimes: [],
            bestMs: null,
            totalAttempts: 0,
            validHits: 0,
            errorCount: 0,
            score: 0,
            waitTimer: null,
            stimTimer: null,
            feedbackTimer: null,
            durationTimer: null,
            periphInterval: null,
            periphTargets: new Map(),
            periphSeq: 0
        };

        const LS_PODIUM_KEY = 'reflexesport_podium_top3_v1';
        const LS_LAST_PLAYER_KEY = 'reflexesport_last_athlete_v1';

        function createEmptyPodiumStore() {
            return {
                reaction: { debutant: [], athlete: [], pro: [] },
                stroop: { debutant: [], athlete: [], pro: [] },
                peripheral: { debutant: [], athlete: [], pro: [] }
            };
        }

        let podiumStore = loadPodiumStore();
        let lastAthleteName = localStorage.getItem(LS_LAST_PLAYER_KEY) || '';

        function loadPodiumStore() {
            const base = createEmptyPodiumStore();
            try {
                const raw = localStorage.getItem(LS_PODIUM_KEY);
                if (!raw) return base;
                const parsed = JSON.parse(raw);
                ['reaction', 'stroop', 'peripheral'].forEach(m => {
                    if (parsed[m]) {
                        ['debutant', 'athlete', 'pro'].forEach(d => {
                            if (Array.isArray(parsed[m][d])) base[m][d] = parsed[m][d];
                        });
                    }
                });
            } catch (e) {}
            return base;
        }

        function savePodiumStore() {
            try { localStorage.setItem(LS_PODIUM_KEY, JSON.stringify(podiumStore)); } catch (e) {}
            updateTotalRecordsBadge();
        }

        function updateTotalRecordsBadge() {
            let count = 0;
            ['reaction', 'stroop', 'peripheral'].forEach(m => {
                ['debutant', 'athlete', 'pro'].forEach(d => { count += (podiumStore[m][d] || []).length; });
            });
            document.getElementById('totalRecordsBadge').textContent = String(count);
        }

        function sortTop3(entries) {
            return [...entries].sort((a, b) => {
                if (a.avgMs !== b.avgMs) return a.avgMs - b.avgMs;
                if (b.score !== a.score) return b.score - a.score;
                return b.accuracy - a.accuracy;
            });
        }

        function qualifiesForTop3(mode, diff, candidate) {
            if (!candidate || !candidate.avgMs || candidate.avgMs <= 0 || candidate.validHits <= 0) return false;
            const list = sortTop3(podiumStore[mode][diff] || []);
            if (list.length < 3) return true;
            const third = list[2];
            if (candidate.avgMs !== third.avgMs) return candidate.avgMs < third.avgMs;
            if (candidate.score !== third.score) return candidate.score > third.score;
            return candidate.accuracy > third.accuracy;
        }

        function selectMode(mode) {
            if (state.isRunning) stopSession(false);
            state.mode = mode;
            ['reaction', 'stroop', 'peripheral'].forEach(m => {
                document.getElementById(`mode-card-${m}`).className = m === mode ? 'mode-card active' : 'mode-card';
            });
            document.getElementById('stroopSubControl').classList.toggle('hidden', mode !== 'stroop');
            renderIdleArena();
            renderStroopControlsBar();
        }

        function setDifficulty(diff) {
            if (state.isRunning) stopSession(false);
            state.difficulty = diff;
            ['debutant', 'athlete', 'pro'].forEach(d => {
                document.getElementById(`diff-${d}`).className = d === diff ? 'pill-btn active-emerald' : 'pill-btn';
            });
            renderIdleArena();
        }

        function setSessionFormat(fmt) {
            if (state.isRunning) stopSession(false);
            state.sessionFormat = fmt;
            document.getElementById('fmt-targets').className = fmt === 'targets' ? 'pill-btn active-cyan' : 'pill-btn';
            document.getElementById('fmt-duration').className = fmt === 'duration' ? 'pill-btn active-cyan' : 'pill-btn';
            populateAmountSelect();
            updateLiveDashboard();
        }

        function populateAmountSelect() {
            const sel = document.getElementById('sessionAmountSelect');
            if (state.sessionFormat === 'targets') {
                const opts = [10, 15, 20];
                if (!opts.includes(state.sessionAmount)) state.sessionAmount = 15;
                sel.innerHTML = opts.map(n => `<option value="${n}" ${n === state.sessionAmount ? 'selected' : ''}>${n}</option>`).join('');
            } else {
                const opts = [30, 60];
                if (!opts.includes(state.sessionAmount)) state.sessionAmount = 30;
                sel.innerHTML = opts.map(s => `<option value="${s}" ${s === state.sessionAmount ? 'selected' : ''}>${s}s</option>`).join('');
            }
        }

        function setSessionAmount(val) {
            if (state.isRunning) stopSession(false);
            state.sessionAmount = Number(val);
            updateLiveDashboard();
        }

        function setStroopSubMode(sub) {
            if (state.isRunning) stopSession(false);
            state.stroopSubMode = sub;
            document.getElementById('stroop-sub-color').className = sub === 'color' ? 'pill-btn active-cyan' : 'pill-btn';
            document.getElementById('stroop-sub-arrow').className = sub === 'arrow' ? 'pill-btn active-cyan' : 'pill-btn';
            renderIdleArena();
            renderStroopControlsBar();
        }

        function clearAllTimers() {
            if (state.waitTimer) { clearTimeout(state.waitTimer); state.waitTimer = null; }
            if (state.stimTimer) { clearTimeout(state.stimTimer); state.stimTimer = null; }
            if (state.feedbackTimer) { clearTimeout(state.feedbackTimer); state.feedbackTimer = null; }
            if (state.durationTimer) { clearInterval(state.durationTimer); state.durationTimer = null; }
            if (state.periphInterval) { clearInterval(state.periphInterval); state.periphInterval = null; }
            state.periphTargets.forEach(t => clearTimeout(t.timer));
            state.periphTargets.clear();
        }

        function toggleSession() {
            if (state.isRunning) stopSession(false);
            else startSession();
        }

        function startSession() {
            clearAllTimers();
            ensureAudio();
            SFX.start();

            state.isRunning = true;
            state.phase = 'waiting';
            state.completedHits = 0;
            state.elapsedSeconds = 0;
            state.sessionStartedAt = performance.now();
            state.reactionTimes = [];
            state.bestMs = null;
            state.totalAttempts = 0;
            state.validHits = 0;
            state.errorCount = 0;
            state.score = 0;

            updateLiveDashboard();
            updateSessionControlsUI();
            renderStroopControlsBar();

            if (state.sessionFormat === 'duration') {
                state.durationTimer = setInterval(() => {
                    if (!state.isRunning) return;
                    state.elapsedSeconds = Math.floor((performance.now() - state.sessionStartedAt) / 1000);
                    updateLiveDashboard();
                    if (state.elapsedSeconds >= state.sessionAmount) stopSession(true);
                }, 200);
            }

            if (state.mode === 'reaction') scheduleReactionRound();
            else if (state.mode === 'stroop') scheduleStroopRound();
            else startPeripheralSession();
        }

        function stopSession(completedNaturally) {
            const wasRunning = state.isRunning;
            clearAllTimers();
            state.isRunning = false;
            state.phase = 'idle';
            updateSessionControlsUI();
            renderIdleArena();
            renderStroopControlsBar();
            if (wasRunning && completedNaturally) finalizeSessionResults();
        }

        function checkTargetCompletion() {
            if (!state.isRunning) return false;
            if (state.sessionFormat === 'targets' && state.completedHits >= state.sessionAmount) {
                setTimeout(() => stopSession(true), 300);
                return true;
            }
            return false;
        }

        function computeHitPoints(ms) {
            const diffMult = state.difficulty === 'pro' ? 1.5 : state.difficulty === 'athlete' ? 1.2 : 1.0;
            const speedBonus = Math.max(40, Math.round(650 - ms));
            return Math.round(speedBonus * diffMult);
        }

        function recordValidHit(ms) {
            state.totalAttempts += 1;
            state.validHits += 1;
            state.completedHits += 1;
            state.reactionTimes.push(ms);
            if (state.bestMs === null || ms < state.bestMs) state.bestMs = ms;
            state.score += computeHitPoints(ms);
            updateLiveDashboard();
        }

        function recordMistake(penaltyPts = 50) {
            state.totalAttempts += 1;
            state.errorCount += 1;
            state.score = Math.max(0, state.score - penaltyPts);
            updateLiveDashboard();
        }

        function updateSessionControlsUI() {
            const btn = document.getElementById('startStopBtn');
            const txt = document.getElementById('startStopText');
            if (state.isRunning) {
                btn.className = 'btn-stop';
                txt.textContent = '■ Arrêter';
            } else {
                btn.className = 'btn-start';
                txt.textContent = '▶ Démarrer la session';
            }
        }

        function setArenaHeader(status, dotColor, hint, stageExtraClass = '') {
            document.getElementById('arenaStatusText').textContent = status;
            document.getElementById('arenaStatusDot').style.background = dotColor;
            document.getElementById('arenaHintText').textContent = hint;
            document.getElementById('arenaStage').className = `arena-stage ${stageExtraClass}`.trim();
        }

        function renderIdleArena() {
            const stage = document.getElementById('arenaStage');
            const diffLabel = DIFF_CONFIG[state.difficulty].label;
            if (state.mode === 'reaction') {
                setArenaHeader('Prêt', '#34d399', `Niveau ${diffLabel}`);
                stage.innerHTML = `
                    <div style="text-align:center; max-width:300px;">
                        <div style="font-size:2.1rem; margin-bottom:4px;">⚡</div>
                        <h3 style="font-size:1.05rem; font-weight:900;">Vitesse de Réaction</h3>
                        <p style="font-size:0.78rem; color:var(--text-400); margin-top:4px;">Touchez l'écran dès que le cercle passe au <strong style="color:#34d399;">VERT</strong>.</p>
                    </div>
                `;
            } else if (state.mode === 'stroop') {
                const subDesc = state.stroopSubMode === 'color'
                    ? 'Touchez la <strong>couleur de l’encre</strong> et ignorez le mot écrit.'
                    : 'Touchez la direction indiquée ou <strong>inversée</strong>.';
                setArenaHeader('Prêt', '#22d3ee', `Niveau ${diffLabel}`);
                stage.innerHTML = `
                    <div style="text-align:center; max-width:300px;">
                        <div style="font-size:2.1rem; margin-bottom:4px;">🧠</div>
                        <h3 style="font-size:1.05rem; font-weight:900;">Stroop & Décision</h3>
                        <p style="font-size:0.78rem; color:var(--text-400); margin-top:4px;">${subDesc}</p>
                    </div>
                `;
            } else {
                const gridSize = DIFF_CONFIG[state.difficulty].periphGrid;
                setArenaHeader('Prêt', '#fbbf24', `Grille ${gridSize}×${gridSize}`);
                stage.innerHTML = `
                    <div style="text-align:center; max-width:300px;">
                        <div style="font-size:2.1rem; margin-bottom:4px;">👁️</div>
                        <h3 style="font-size:1.05rem; font-weight:900;">Vision Périphérique (${gridSize}×${gridSize})</h3>
                        <p style="font-size:0.78rem; color:var(--text-400); margin-top:4px;">Fixez le centre bleu et touchez chaque cible lumineuse.</p>
                    </div>
                `;
            }
        }

        function scheduleReactionRound() {
            if (!state.isRunning || state.mode !== 'reaction') return;
            const cfg = DIFF_CONFIG[state.difficulty];
            state.phase = 'waiting';
            setArenaHeader('Attente...', '#ef4444', 'Ne touchez pas le rouge', 'waiting-red');
            document.getElementById('arenaStage').innerHTML = `
                <div class="circle-wait">
                    <span style="font-size:0.88rem;">ATTENDEZ</span>
                    <span style="font-size:0.68rem; opacity:0.85; margin-top:2px;">Signal vert...</span>
                </div>
            `;

            const delay = cfg.minWait + Math.random() * (cfg.maxWait - cfg.minWait);
            state.waitTimer = setTimeout(() => {
                if (!state.isRunning || state.mode !== 'reaction') return;
                state.phase = 'active';
                state.stimulusShownAt = performance.now();
                SFX.stimulus();
                setArenaHeader('TOUCHEZ !', '#34d399', 'Réaction immédiate', 'go-green');
                document.getElementById('arenaStage').innerHTML = `
                    <div class="circle-go">
                        <span style="font-size:1.35rem;">GO !</span>
                        <span style="font-size:0.68rem;">TOUCHEZ</span>
                    </div>
                `;

                state.stimTimer = setTimeout(() => {
                    if (!state.isRunning || state.phase !== 'active') return;
                    state.phase = 'feedback';
                    SFX.error();
                    recordMistake(40);
                    setArenaHeader('Trop lent !', '#f59e0b', 'Délai dépassé');
                    document.getElementById('arenaStage').innerHTML = `<div style="font-size:1.45rem; font-weight:900; color:var(--amber-400);">Trop lent !</div>`;
                    state.feedbackTimer = setTimeout(scheduleReactionRound, 600);
                }, cfg.reactionTimeout);
            }, delay);
        }

        function handleReactionTrigger() {
            if (!state.isRunning || state.mode !== 'reaction') return;
            if (state.phase === 'waiting') {
                clearTimeout(state.waitTimer);
                state.phase = 'feedback';
                SFX.error();
                recordMistake(60);
                setArenaHeader('Trop tôt !', '#ef4444', 'Faux départ');
                document.getElementById('arenaStage').innerHTML = `<div style="font-size:1.5rem; font-weight:900; color:var(--red-400);">Trop tôt !</div>`;
                state.feedbackTimer = setTimeout(scheduleReactionRound, 720);
                return;
            }
            if (state.phase !== 'active') return;
            clearTimeout(state.stimTimer);
            const ms = Math.round(performance.now() - state.stimulusShownAt);
            if (ms < 85) {
                state.phase = 'feedback';
                SFX.error();
                recordMistake(60);
                document.getElementById('arenaStage').innerHTML = `<div style="font-size:1.4rem; font-weight:900; color:var(--red-400);">Trop tôt ! (${ms} ms)</div>`;
                state.feedbackTimer = setTimeout(scheduleReactionRound, 680);
                return;
            }
            state.phase = 'feedback';
            SFX.hit();
            recordValidHit(ms);
            setArenaHeader('Validé', '#34d399', 'Réflexe mesuré');
            document.getElementById('arenaStage').innerHTML = `<div class="mono" style="font-size:2.4rem; font-weight:900; color:var(--emerald-400);">${ms} ms</div>`;
            if (!checkTargetCompletion()) {
                state.feedbackTimer = setTimeout(scheduleReactionRound, 480);
            }
        }

        function renderStroopControlsBar() {
            const bar = document.getElementById('stroopControlsBar');
            if (state.mode !== 'stroop') {
                bar.classList.add('hidden');
                return;
            }
            bar.classList.remove('hidden');

            if (state.stroopSubMode === 'color') {
                bar.innerHTML = STROOP_COLORS.map(c => `
                    <button
                        type="button"
                        class="stroop-choice-btn"
                        ${!state.isRunning ? 'disabled' : ''}
                        onpointerdown="event.preventDefault(); handleStroopAnswer('${c.id}')"
                    >
                        <span style="width:13px; height:13px; border-radius:50%; background:${c.hex};"></span>
                        <span>${c.btnLabel}</span>
                    </button>
                `).join('');
            } else {
                bar.innerHTML = STROOP_ARROWS.map(a => `
                    <button
                        type="button"
                        class="stroop-choice-btn"
                        ${!state.isRunning ? 'disabled' : ''}
                        onpointerdown="event.preventDefault(); handleStroopAnswer('${a.id}')"
                    >
                        <span class="mono" style="font-size:1.15rem; color:var(--cyan-400);">${a.symbol}</span>
                        <span>${a.label}</span>
                    </button>
                `).join('');
            }
        }

        function scheduleStroopRound() {
            if (!state.isRunning || state.mode !== 'stroop') return;
            const cfg = DIFF_CONFIG[state.difficulty];
            state.phase = 'waiting';
            setArenaHeader('Préparation...', '#22d3ee', 'Analyse cognitive');
            document.getElementById('arenaStage').innerHTML = `<div style="color:var(--cyan-400); font-weight:900; font-size:1.3rem;">•••</div>`;

            state.waitTimer = setTimeout(() => {
                if (!state.isRunning || state.mode !== 'stroop') return;
                state.phase = 'active';
                state.stimulusShownAt = performance.now();
                SFX.stimulus();
                const stage = document.getElementById('arenaStage');

                if (state.stroopSubMode === 'color') {
                    const wordObj = STROOP_COLORS[Math.floor(Math.random() * STROOP_COLORS.length)];
                    const otherColors = STROOP_COLORS.filter(c => c.id !== wordObj.id);
                    const inkObj = Math.random() < 0.82 ? otherColors[Math.floor(Math.random() * otherColors.length)] : wordObj;
                    state.expectedAnswerId = inkObj.id;
                    setArenaHeader('COULEUR ENCRE', '#34d399', 'Touchez la couleur d’affichage');
                    stage.innerHTML = `
                        <div class="stroop-stimulus-box">
                            <span class="stroop-rule-tag">Couleur de l'encre</span>
                            <div class="stroop-word-display" style="color:${inkObj.hex};">${wordObj.label}</div>
                        </div>
                    `;
                } else {
                    const arrowObj = STROOP_ARROWS[Math.floor(Math.random() * STROOP_ARROWS.length)];
                    const isInverted = Math.random() < cfg.invertArrowProb;
                    const oppositeMap = { left: 'right', right: 'left', up: 'down', down: 'up' };
                    state.expectedAnswerId = isInverted ? oppositeMap[arrowObj.id] : arrowObj.id;
                    setArenaHeader(isInverted ? 'INVERSÉ' : 'DIRECT', isInverted ? '#fbbf24' : '#22d3ee', isInverted ? 'Touchez l’opposé !' : 'Touchez la direction');
                    stage.innerHTML = `
                        <div class="stroop-stimulus-box">
                            <span class="stroop-rule-tag ${isInverted ? 'inverted' : ''}">${isInverted ? '⚠️ Direction Inversée' : 'Direction Directe'}</span>
                            <div class="stroop-arrow-display" style="color:${isInverted ? 'var(--amber-300)' : 'var(--cyan-400)'};">${arrowObj.symbol}</div>
                        </div>
                    `;
                }

                state.stimTimer = setTimeout(() => {
                    if (!state.isRunning || state.phase !== 'active') return;
                    resolveStroopChoice(null, true);
                }, cfg.stroopTimeout);
            }, 340 + Math.random() * 400);
        }

        function handleStroopAnswer(answerId) {
            if (!state.isRunning || state.mode !== 'stroop' || state.phase !== 'active') return;
            clearTimeout(state.stimTimer);
            resolveStroopChoice(answerId, false);
        }

        function resolveStroopChoice(answerId, timedOut) {
            state.phase = 'feedback';
            const ms = Math.round(performance.now() - state.stimulusShownAt);
            const ok = !timedOut && answerId === state.expectedAnswerId;

            if (ok) {
                SFX.hit();
                recordValidHit(ms);
                setArenaHeader('Validé', '#34d399', 'Bonne réponse');
                document.getElementById('arenaStage').innerHTML = `<div class="mono" style="font-size:2.2rem; font-weight:900; color:var(--emerald-400);">${ms} ms</div>`;
            } else {
                SFX.error();
                const expectedLabel = state.stroopSubMode === 'color'
                    ? (STROOP_COLORS.find(c => c.id === state.expectedAnswerId)?.btnLabel || '')
                    : (STROOP_ARROWS.find(a => a.id === state.expectedAnswerId)?.label || '');
                recordMistake(50);
                setArenaHeader('Erreur', '#ef4444', `Attendu : ${expectedLabel}`);
                document.getElementById('arenaStage').innerHTML = `
                    <div style="text-align:center;">
                        <div style="font-size:1.35rem; font-weight:900; color:var(--red-400);">${timedOut ? 'Temps dépassé' : 'Erreur'}</div>
                        <p style="font-size:0.8rem; color:var(--text-300); margin-top:2px;">Attendu : <strong>${expectedLabel}</strong></p>
                    </div>
                `;
            }

            if (!checkTargetCompletion()) {
                state.feedbackTimer = setTimeout(scheduleStroopRound, 480);
            }
        }

        function startPeripheralSession() {
            const cfg = DIFF_CONFIG[state.difficulty];
            const g = cfg.periphGrid;
            state.phase = 'active';
            setArenaHeader('Périphérie', '#fbbf24', `Fixez le centre • Grille ${g}×${g}`);

            const stage = document.getElementById('arenaStage');
            stage.innerHTML = `
                <div id="periphGridEl" class="periph-grid" style="grid-template-columns: repeat(${g}, minmax(0, 1fr));">
                    <div class="periph-fixation" aria-hidden="true"></div>
                </div>
            `;

            const gridEl = document.getElementById('periphGridEl');
            for (let i = 0; i < g * g; i++) {
                const cell = document.createElement('div');
                cell.className = 'periph-cell';
                gridEl.appendChild(cell);
            }

            spawnPeripheralWave(cfg);
            state.periphInterval = setInterval(() => {
                if (!state.isRunning || state.mode !== 'peripheral') return;
                spawnPeripheralWave(cfg);
            }, cfg.periphSpawnMs);
        }

        function spawnPeripheralWave(cfg) {
            const gridEl = document.getElementById('periphGridEl');
            if (!gridEl) return;
            const freeCells = Array.from(gridEl.querySelectorAll('.periph-cell')).filter(c => !c.querySelector('.periph-target'));
            if (freeCells.length === 0) return;

            const spawnCount = Math.min(freeCells.length, cfg.periphMulti > 1 && Math.random() < 0.5 ? 2 : 1);
            for (let k = 0; k < spawnCount; k++) {
                const idx = Math.floor(Math.random() * freeCells.length);
                const cell = freeCells.splice(idx, 1)[0];
                const targetId = ++state.periphSeq;
                const spawnedAt = performance.now();
                SFX.stimulus();

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'periph-target';
                btn.textContent = '●';

                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const entry = state.periphTargets.get(targetId);
                    if (!entry || !state.isRunning) return;
                    clearTimeout(entry.timer);
                    state.periphTargets.delete(targetId);
                    btn.remove();

                    const ms = Math.round(performance.now() - spawnedAt);
                    SFX.hit();
                    recordValidHit(ms);
                    checkTargetCompletion();
                }, { passive: false });

                cell.appendChild(btn);

                const timer = setTimeout(() => {
                    if (!state.periphTargets.has(targetId)) return;
                    state.periphTargets.delete(targetId);
                    btn.remove();
                    if (state.isRunning) {
                        SFX.error();
                        recordMistake(40);
                    }
                }, cfg.periphLifeMs);

                state.periphTargets.set(targetId, { timer });
            }
        }

        function handleStagePointer(e) {
            if (!state.isRunning) return;
            if (state.mode === 'reaction') {
                e.preventDefault();
                handleReactionTrigger();
            } else if (state.mode === 'peripheral' && state.phase === 'active') {
                if (e.target.closest('.periph-target')) return;
                SFX.error();
                recordMistake(30);
            }
        }

        function getAverageMs() {
            if (state.reactionTimes.length === 0) return null;
            return Math.round(state.reactionTimes.reduce((a, b) => a + b, 0) / state.reactionTimes.length);
        }

        function getAccuracy() {
            if (state.totalAttempts === 0) return null;
            return Math.round((state.validHits / state.totalAttempts) * 100);
        }

        function updateLiveDashboard() {
            const avg = getAverageMs();
            const acc = getAccuracy();
            document.getElementById('kpiAvgMs').textContent = avg !== null ? `${avg} ms` : '-- ms';
            document.getElementById('kpiBestMs').textContent = state.bestMs !== null ? `${state.bestMs} ms` : '-- ms';
            document.getElementById('kpiAccuracy').textContent = acc !== null ? `${acc} %` : '-- %';

            if (state.sessionFormat === 'targets') {
                document.getElementById('kpiProgLabel').textContent = 'Cibles';
                document.getElementById('kpiProgressVal').textContent = `${Math.min(state.completedHits, state.sessionAmount)}/${state.sessionAmount}`;
            } else {
                document.getElementById('kpiProgLabel').textContent = 'Temps';
                const rem = state.isRunning ? Math.max(0, state.sessionAmount - state.elapsedSeconds) : state.sessionAmount;
                document.getElementById('kpiProgressVal').textContent = `${rem}s`;
            }
        }

        const podiumModalState = { mode: 'reaction', diff: 'athlete', pendingCandidate: null, editingIndex: null };

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function finalizeSessionResults() {
            const avgMs = getAverageMs();
            const accuracy = getAccuracy() ?? 0;

            if (!avgMs || state.validHits === 0) {
                openSummaryModal({ avgMs: null, bestMs: null, accuracy, score: state.score });
                return;
            }

            const candidate = {
                name: '',
                avgMs,
                bestMs: state.bestMs,
                accuracy,
                score: state.score,
                validHits: state.validHits,
                date: new Date().toLocaleDateString('fr-FR')
            };

            if (qualifiesForTop3(state.mode, state.difficulty, candidate)) {
                SFX.fanfare();
                openPodiumModal({
                    mode: state.mode,
                    diff: state.difficulty,
                    pendingCandidate: candidate,
                    recordSummary: `${MODE_LABELS[state.mode]} (${DIFF_CONFIG[state.difficulty].label}) : ${avgMs} ms • ${state.score} pts`
                });
            } else {
                openSummaryModal({ avgMs, bestMs: state.bestMs, accuracy, score: state.score });
            }
        }

        function openPodiumModal(options = {}) {
            podiumModalState.editingIndex = null;
            podiumModalState.mode = options.mode || state.mode;
            podiumModalState.diff = options.diff || state.difficulty;

            const banner = document.getElementById('newRecordBanner');
            if (options.pendingCandidate) {
                podiumModalState.pendingCandidate = options.pendingCandidate;
                document.getElementById('newRecordSummary').textContent = options.recordSummary || '';
                const input = document.getElementById('newRecordPlayerInput');
                input.value = lastAthleteName;
                banner.classList.remove('hidden');
                setTimeout(() => input.focus(), 100);
            } else {
                podiumModalState.pendingCandidate = null;
                banner.classList.add('hidden');
            }

            renderPodiumModal();
            document.getElementById('podiumModalBackdrop').classList.remove('hidden');
        }

        function closePodiumModal() {
            podiumModalState.pendingCandidate = null;
            podiumModalState.editingIndex = null;
            document.getElementById('podiumModalBackdrop').classList.add('hidden');
        }

        function handlePodiumBackdropClick(e) {
            if (e.target === document.getElementById('podiumModalBackdrop')) closePodiumModal();
        }

        function switchPodiumMode(mode) { podiumModalState.mode = mode; podiumModalState.editingIndex = null; renderPodiumModal(); }
        function switchPodiumDiff(diff) { podiumModalState.diff = diff; podiumModalState.editingIndex = null; renderPodiumModal(); }

        function submitNewPodiumRecord(e) {
            e.preventDefault();
            if (!podiumModalState.pendingCandidate) return;
            const athleteName = document.getElementById('newRecordPlayerInput').value.trim() || 'Athlète';
            lastAthleteName = athleteName;
            try { localStorage.setItem(LS_LAST_PLAYER_KEY, athleteName); } catch (err) {}

            const { mode, diff, pendingCandidate } = podiumModalState;
            pendingCandidate.name = athleteName;
            podiumStore[mode][diff] = sortTop3([...(podiumStore[mode][diff] || []), pendingCandidate]).slice(0, 3);
            savePodiumStore();

            SFX.hit();
            podiumModalState.pendingCandidate = null;
            document.getElementById('newRecordBanner').classList.add('hidden');
            renderPodiumModal();
        }

        function renderPodiumModal() {
            const { mode, diff } = podiumModalState;
            ['reaction', 'stroop', 'peripheral'].forEach(m => {
                document.getElementById(`pod-mode-${m}`).className = m === mode ? 'pill-btn active-emerald' : 'pill-btn';
            });
            ['debutant', 'athlete', 'pro'].forEach(d => {
                document.getElementById(`pod-diff-${d}`).className = d === diff ? 'pill-btn active-cyan' : 'pill-btn';
            });

            const entries = sortTop3(podiumStore[mode][diff] || []).slice(0, 3);
            const first = entries[0] || null, second = entries[1] || null, third = entries[2] || null;
            const fmtMain = (e) => `${e.avgMs} ms • ${e.score} pts`;

            document.getElementById('podiumVisualStage').innerHTML = `
                <div class="podium-col">
                    <div class="podium-player-info">
                        <span class="podium-medal">🥈</span>
                        <div class="podium-name">${second ? escapeHtml(second.name) : '—'}</div>
                        <div class="podium-metric mono">${second ? fmtMain(second) : 'Libre'}</div>
                    </div>
                    <div class="podium-step rank-2"><span class="step-num mono" style="color:#e2e8f0;">2</span><span class="step-label" style="color:#94a3b8;">Argent</span></div>
                </div>
                <div class="podium-col">
                    <div class="podium-player-info">
                        <span class="podium-medal first">🥇</span>
                        <div class="podium-name gold">${first ? escapeHtml(first.name) : '—'}</div>
                        <div class="podium-metric mono" style="color:var(--amber-300);">${first ? fmtMain(first) : 'Libre'}</div>
                    </div>
                    <div class="podium-step rank-1"><span class="step-num mono" style="color:var(--amber-300);">1</span><span class="step-label" style="color:var(--amber-300);">Or</span></div>
                </div>
                <div class="podium-col">
                    <div class="podium-player-info">
                        <span class="podium-medal">🥉</span>
                        <div class="podium-name">${third ? escapeHtml(third.name) : '—'}</div>
                        <div class="podium-metric mono">${third ? fmtMain(third) : 'Libre'}</div>
                    </div>
                    <div class="podium-step rank-3"><span class="step-num mono" style="color:#fbbf24;">3</span><span class="step-label" style="color:#d97706;">Bronze</span></div>
                </div>
            `;

            const ranksMeta = [
                { badge: '🥇 1er', cls: 'r1' },
                { badge: '🥈 2e', cls: 'r2' },
                { badge: '🥉 3e', cls: 'r3' }
            ];

            document.getElementById('podiumDetailedList').innerHTML = [0, 1, 2].map(idx => {
                const entry = entries[idx], meta = ranksMeta[idx];
                if (!entry) return `<div class="podium-row empty"><span class="rank-pill ${meta.cls} mono">${meta.badge}</span><span>Place disponible...</span></div>`;
                if (podiumModalState.editingIndex === idx) {
                    return `
                        <form class="podium-row" onsubmit="saveInlineRename(event, ${idx})">
                            <div class="podium-row-left" style="flex:1;">
                                <span class="rank-pill ${meta.cls} mono">${meta.badge}</span>
                                <input type="text" id="inlinePlayerRenameInput" class="text-input" style="padding:5px 9px; font-size:0.84rem;" maxlength="20" value="${escapeHtml(entry.name)}" required />
                            </div>
                            <button type="submit" class="btn-start" style="width:auto; height:32px; padding:0 10px; font-size:0.74rem;">OK</button>
                        </form>
                    `;
                }
                return `
                    <div class="podium-row">
                        <div class="podium-row-left">
                            <span class="rank-pill ${meta.cls} mono">${meta.badge}</span>
                            <div style="min-width:0;">
                                <div style="font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(entry.name)}</div>
                                <div class="mono" style="font-size:0.68rem; color:var(--text-400);">${entry.avgMs} ms • ${entry.score} pts • ${entry.accuracy}%</div>
                            </div>
                        </div>
                        <button type="button" class="btn-icon-edit" onclick="beginInlineRename(${idx})">✏️ Nom</button>
                    </div>
                `;
            }).join('');

            document.getElementById('resetPodiumZone').innerHTML = `<button type="button" class="btn-reset-cat" onclick="promptResetPodium()">🗑️ Réinitialiser</button>`;
        }

        function beginInlineRename(idx) {
            podiumModalState.editingIndex = idx;
            renderPodiumModal();
            const inp = document.getElementById('inlinePlayerRenameInput');
            if (inp) { inp.focus(); inp.select(); }
        }

        function saveInlineRename(e, idx) {
            e.preventDefault();
            const inp = document.getElementById('inlinePlayerRenameInput');
            if (!inp) return;
            const newName = inp.value.trim();
            if (!newName) return;
            const { mode, diff } = podiumModalState;
            const sorted = sortTop3(podiumStore[mode][diff] || []);
            if (sorted[idx]) { sorted[idx].name = newName; podiumStore[mode][diff] = sorted; savePodiumStore(); }
            podiumModalState.editingIndex = null;
            renderPodiumModal();
        }

        function promptResetPodium() {
            document.getElementById('resetPodiumZone').innerHTML = `
                <div style="display:flex; align-items:center; gap:6px;">
                    <button type="button" class="btn-stop" style="width:auto; height:30px; padding:0 9px; font-size:0.7rem;" onclick="confirmResetPodium()">Confirmer</button>
                    <button type="button" class="btn-secondary" style="padding:5px 8px; font-size:0.7rem;" onclick="renderPodiumModal()">Annuler</button>
                </div>
            `;
        }

        function confirmResetPodium() {
            const { mode, diff } = podiumModalState;
            podiumStore[mode][diff] = [];
            savePodiumStore();
            renderPodiumModal();
        }

        function openSummaryModal({ avgMs, bestMs, accuracy, score }) {
            document.getElementById('summaryModalSub').textContent = `${MODE_LABELS[state.mode]} • ${DIFF_CONFIG[state.difficulty].label}`;
            document.getElementById('summaryStatsGrid').innerHTML = `
                <div class="summary-stat-box"><div style="font-size:0.66rem; color:var(--text-400); font-weight:800;">MOYEN</div><div class="mono" style="font-size:1.1rem; font-weight:900; color:var(--cyan-400);">${avgMs !== null ? avgMs + ' ms' : '--'}</div></div>
                <div class="summary-stat-box"><div style="font-size:0.66rem; color:var(--text-400); font-weight:800;">MEILLEUR</div><div class="mono" style="font-size:1.1rem; font-weight:900; color:var(--emerald-400);">${bestMs !== null ? bestMs + ' ms' : '--'}</div></div>
                <div class="summary-stat-box"><div style="font-size:0.66rem; color:var(--text-400); font-weight:800;">PRÉCISION</div><div class="mono" style="font-size:1.1rem; font-weight:900; color:var(--volt-400);">${accuracy} %</div></div>
                <div class="summary-stat-box"><div style="font-size:0.66rem; color:var(--text-400); font-weight:800;">SCORE</div><div class="mono" style="font-size:1.1rem; font-weight:900; color:var(--amber-300);">${score} pts</div></div>
            `;
            document.getElementById('summaryRankHint').textContent = 'Battez le temps moyen du Top 3 pour entrer sur le podium !';
            document.getElementById('summaryModalBackdrop').classList.remove('hidden');
        }

        function closeSummaryModal() { document.getElementById('summaryModalBackdrop').classList.add('hidden'); }
        function openPodiumFromSummary() { closeSummaryModal(); openPodiumModal({ mode: state.mode, diff: state.difficulty }); }
        function replayFromSummary() { closeSummaryModal(); startSession(); }

        window.onload = function () {
            populateAmountSelect();
            updateTotalRecordsBadge();
            updateLiveDashboard();
            renderIdleArena();
        };
    </script>
</body>
</html>
