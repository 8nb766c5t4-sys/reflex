<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RéflexeSport" />
  <meta name="theme-color" content="#0b0f17" />
  <title>RéflexeSport iPhone — Réflexes Visuels</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-2: #1b2434;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f3f6fb;
      --muted: #93a0b8;
      --accent: #22d3ee;
      --accent-2: #a3e635;
      --danger: #f43f5e;
      --warn: #f59e0b;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
      height: 100dvh;
      padding: calc(8px + var(--safe-top)) 12px calc(10px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 7px 10px;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }

    .brand-badge {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #061018;
      font-weight: 900;
      font-size: 14px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .icon-btn, .podium-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 11px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .icon-btn { width: 34px; font-size: 15px; }

    .podium-btn {
      padding: 0 10px;
      border-color: rgba(251, 191, 36, 0.38);
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.16), rgba(245, 158, 11, 0.08));
      color: #fde68a;
      white-space: nowrap;
    }

    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }

    .modes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

    .mode-pill {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      border-radius: 10px;
      padding: 7px 4px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .mode-pill.active { background: rgba(34, 211, 238, 0.16); border-color: var(--accent); color: var(--text); }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .seg-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg);
      padding: 2px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 2px;
      border-radius: 7px;
      cursor: pointer;
    }

    .seg-btn.active { background: var(--surface-2); color: var(--text); }

    .stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex-shrink: 0; }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 6px 4px;
      text-align: center;
    }

    .stat-val { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

    .arena {
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      touch-action: manipulation;
    }

    .arena.touch-flash { box-shadow: inset 0 0 0 2px var(--accent); }

    .reaction-pad {
      flex: 1;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 14px;
      background: var(--surface-2);
      border: 2px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .reaction-pad.wait { background: rgba(244, 63, 94, 0.22); border-color: var(--danger); }
    .reaction-pad.go { background: rgba(163, 230, 53, 0.28); border-color: var(--accent-2); }
    .reaction-big { font-size: 26px; font-weight: 900; }
    .reaction-sub { margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.35; }

    .stroop-top {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .stroop-rule {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(34, 211, 238, 0.12);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .stroop-word { font-size: clamp(30px, 8vw, 40px); font-weight: 900; line-height: 1.1; }

    .thumb-choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }

    .thumb-btn {
      height: 50px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: var(--surface-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .thumb-btn:active { transform: scale(0.97); }

    .periph-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .periph-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .periph-grid {
      display: grid;
      gap: 6px;
      width: min(100%, 38dvh);
      aspect-ratio: 1 / 1;
    }

    .periph-cell {
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 900;
      font-size: 14px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .periph-cell.center-fix { background: rgba(34, 211, 238, 0.12); border-color: rgba(34, 211, 238, 0.45); color: var(--accent); cursor: default; }
    .periph-cell.target { background: rgba(163, 230, 53, 0.25); border-color: var(--accent-2); color: #ecfccb; }
    .periph-cell.hit { background: rgba(34, 211, 238, 0.28); border-color: var(--accent); }
    .periph-cell.miss { background: rgba(244, 63, 94, 0.28); border-color: var(--danger); }

    .cta-btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #051018;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cta-btn.stop { background: var(--danger); color: #fff; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.82);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px 12px calc(14px + var(--safe-bottom));
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 500px;
      max-height: 86dvh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-head { display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 17px; font-weight: 900; }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .record-banner {
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.45);
      border-radius: 13px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .record-banner.show { display: flex; }
    .record-input-row { display: flex; gap: 8px; }

    .name-input {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(251, 191, 36, 0.5);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      padding: 0 11px;
      outline: none;
    }

    .podium-list { display: flex; flex-direction: column; gap: 7px; }

    .podium-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 9px 11px;
    }

    .podium-row.rank-1 { border-color: rgba(251, 191, 36, 0.45); }
    .podium-row.rank-2 { border-color: rgba(203, 213, 225, 0.35); }
    .podium-row.rank-3 { border-color: rgba(217, 119, 6, 0.4); }
    .rank-medal { font-size: 19px; width: 26px; text-align: center; }
    .podium-info { flex: 1; min-width: 0; }
    .podium-name { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .podium-score { font-size: 11px; color: var(--accent); font-weight: 700; }

    .small-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 9px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .small-btn.danger { color: #fda4af; border-color: rgba(244, 63, 94, 0.35); }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">⚡</div>
        <div class="brand-title">RéflexeSport</div>
      </div>
      <div class="top-actions">
        <button id="openPodiumBtn" class="podium-btn">🏆 Podium <span id="podiumCount">0</span></button>
        <button id="soundBtn" class="icon-btn" aria-label="Son">🔊</button>
      </div>
    </header>

    <section class="controls">
      <div class="modes-grid">
        <button class="mode-pill active" data-mode="reaction">⚡ Réaction</button>
        <button class="mode-pill" data-mode="stroop">🎨 Stroop</button>
        <button class="mode-pill" data-mode="periph">👁️ Périphérie</button>
      </div>

      <div class="row-2">
        <div class="seg-group" id="levelGroup">
          <button class="seg-btn active" data-level="debutant">Débutant</button>
          <button class="seg-btn" data-level="athlete">Athlète</button>
          <button class="seg-btn" data-level="pro">Pro</button>
        </div>
        <div class="seg-group" id="scopeGroup">
          <button class="seg-btn active" data-scope="5">5 essais</button>
          <button class="seg-btn" data-scope="10">10 essais</button>
          <button class="seg-btn" data-scope="15s">15 s</button>
        </div>
      </div>
    </section>

    <section class="stats-strip">
      <div class="stat-box"><div class="stat-val" id="statAvg">—</div><div class="stat-lbl">Moy. ms</div></div>
      <div class="stat-box"><div class="stat-val" id="statBest">—</div><div class="stat-lbl">Meilleur</div></div>
      <div class="stat-box"><div class="stat-val" id="statAcc">100%</div><div class="stat-lbl">Précision</div></div>
      <div class="stat-box"><div class="stat-val" id="statProg">0/5</div><div class="stat-lbl">Progrès</div></div>
    </section>

    <main class="arena" id="arena"></main>

    <button class="cta-btn" id="mainActionBtn">Démarrer la session</button>
  </div>

  <div class="modal-backdrop" id="podiumModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">🏆 Podium Top 3</div>
        <button class="close-btn" id="closePodiumBtn" aria-label="Fermer">✕</button>
      </div>

      <div class="modes-grid" id="podiumModeTabs">
        <button class="mode-pill active" data-pmode="reaction">⚡ Réaction</button>
        <button class="mode-pill" data-pmode="stroop">🎨 Stroop</button>
        <button class="mode-pill" data-pmode="periph">👁️ Périphérie</button>
      </div>

      <div class="seg-group" id="podiumLevelTabs">
        <button class="seg-btn active" data-plevel="debutant">Débutant</button>
        <button class="seg-btn" data-plevel="athlete">Athlète</button>
        <button class="seg-btn" data-plevel="pro">Pro</button>
      </div>

      <div class="record-banner" id="recordBanner">
        <div style="font-weight: 800; color: #fde68a; font-size: 13px;" id="recordBannerText">🎉 Nouveau record ! Nom de l'athlète :</div>
        <div class="record-input-row">
          <input type="text" id="newRecordName" class="name-input" maxlength="20" placeholder="Prénom ou surnom..." autocomplete="off" />
          <button class="cta-btn" id="saveRecordNameBtn" style="width: auto; height: 42px; padding: 0 15px; font-size: 14px;">Valider</button>
        </div>
      </div>

      <div class="podium-list" id="podiumList"></div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; color: var(--muted);">Sauvegarde locale iPhone</span>
        <button class="small-btn danger" id="resetCategoryBtn">Réinitialiser ce podium</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = 'reflexe_sport_iphone_podium_v1';
      const LEVELS = {
        debutant: { minDelay: 950, maxDelay: 2100, grid: 3, targets: 2 },
        athlete:  { minDelay: 650, maxDelay: 1650, grid: 4, targets: 3 },
        pro:      { minDelay: 420, maxDelay: 1200, grid: 5, targets: 4 }
      };
      const STROOP_COLORS = [
        { key: 'rouge', label: 'ROUGE', hex: '#f43f5e' },
        { key: 'bleu',  label: 'BLEU',  hex: '#38bdf8' },
        { key: 'vert',  label: 'VERT',  hex: '#a3e635' },
        { key: 'jaune', label: 'JAUNE', hex: '#fbbf24' }
      ];

      const state = {
        mode: 'reaction',
        level: 'debutant',
        scope: '5',
        soundOn: true,
        running: false,
        sessionTimes: [],
        errors: 0,
        targetCount: 5,
        endTime: 0,
        sessionTimer: null,
        waitTimer: null,
        stimulusStart: 0,
        phase: 'idle',
        stroopExpected: null,
        periphSet: new Set(),
        periphFound: new Set(),
        podiumMode: 'reaction',
        podiumLevel: 'debutant',
        pendingEntryId: null,
        podiumData: loadPodium()
      };

      let audioCtx = null;
      function ensureAudio() {
        if (!state.soundOn) return null;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return audioCtx;
      }

      function beep(freq = 660, duration = 0.08, type = 'sine') {
        const ctx = ensureAudio();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.14, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (_) {}
      }

      function loadPodium() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
        catch (_) { return {}; }
      }

      function savePodium() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.podiumData)); } catch (_) {}
        let total = 0;
        Object.values(state.podiumData).forEach(arr => { if (Array.isArray(arr)) total += arr.length; });
        document.getElementById('podiumCount').textContent = total;
      }

      function getCatKey(mode = state.mode, level = state.level) { return `${mode}__${level}`; }
      function getTop3(mode = state.podiumMode, level = state.podiumLevel) {
        const arr = state.podiumData[getCatKey(mode, level)];
        return Array.isArray(arr) ? arr : [];
      }

      function flashArena() {
        const arena = document.getElementById('arena');
        arena.classList.remove('touch-flash');
        void arena.offsetWidth;
        arena.classList.add('touch-flash');
      }

      function updateLiveStats() {
        const times = state.sessionTimes;
        document.getElementById('statAvg').textContent = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : '—';
        document.getElementById('statBest').textContent = times.length ? `${Math.min(...times)}ms` : '—';
        const totalActions = times.length + state.errors;
        document.getElementById('statAcc').textContent = totalActions > 0 ? `${Math.round((times.length / totalActions) * 100)}%` : '100%';
        if (state.scope === '15s') {
          const rem = state.running ? Math.max(0, Math.ceil((state.endTime - performance.now()) / 1000)) : 15;
          document.getElementById('statProg').textContent = `${rem}s`;
        } else {
          document.getElementById('statProg').textContent = `${Math.min(times.length, Number(state.scope))}/${state.scope}`;
        }
      }

      function renderIdleArena() {
        const lvl = LEVELS[state.level];
        const desc = {
          reaction: `Touchez dès que l'écran devient VERT. Tout contact pendant le ROUGE compte comme faux départ.`,
          stroop: `Touchez en bas la couleur d'ENCRE du mot affiché (et non le sens du texte).`,
          periph: `Fixez le centre (+) puis touchez les ${lvl.targets} cibles allumées sur la grille ${lvl.grid}×${lvl.grid}.`
        }[state.mode];
        document.getElementById('arena').innerHTML = `
          <div class="reaction-pad" style="cursor: default;">
            <div class="reaction-big">Prêt ?</div>
            <div class="reaction-sub">${desc}</div>
          </div>
        `;
      }

      function stopTimers() {
        clearTimeout(state.waitTimer);
        clearInterval(state.sessionTimer);
      }

      function shouldFinish() {
        if (!state.running) return true;
        if (state.scope === '15s') return performance.now() >= state.endTime;
        return state.sessionTimes.length >= state.targetCount;
      }

      function setActionButton(isRunning) {
        const btn = document.getElementById('mainActionBtn');
        if (isRunning) {
          btn.textContent = '■ Arrêter la session';
          btn.classList.add('stop');
        } else {
          btn.textContent = 'Démarrer la session';
          btn.classList.remove('stop');
        }
      }

      function startSession() {
        ensureAudio();
        stopTimers();
        state.running = true;
        state.sessionTimes = [];
        state.errors = 0;
        state.pendingEntryId = null;
        setActionButton(true);
        updateLiveStats();

        if (state.scope === '15s') {
          state.endTime = performance.now() + 15000;
          state.sessionTimer = setInterval(() => {
            updateLiveStats();
            if (performance.now() >= state.endTime) finishSession(true);
          }, 120);
        } else {
          state.targetCount = Number(state.scope);
        }
        nextRound();
      }

      function nextRound() {
        if (shouldFinish()) { finishSession(true); return; }
        updateLiveStats();
        if (state.mode === 'reaction') runReactionRound();
        else if (state.mode === 'stroop') runStroopRound();
        else runPeriphRound();
      }

      function runReactionRound() {
        state.phase = 'wait';
        const lvl = LEVELS[state.level];
        document.getElementById('arena').innerHTML = `
          <div class="reaction-pad wait" id="reactPad">
            <div class="reaction-big" style="color: #fda4af;">ATTENDEZ...</div>
            <div class="reaction-sub">Ne touchez pas avant le signal VERT</div>
          </div>
        `;
        const pad = document.getElementById('reactPad');
        pad.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          ensureAudio();
          flashArena();
          if (!state.running) return;
          if (state.phase === 'wait') {
            clearTimeout(state.waitTimer);
            state.errors += 1;
            beep(210, 0.14, 'sawtooth');
            pad.className = 'reaction-pad';
            pad.innerHTML = `<div class="reaction-big" style="color: var(--warn);">FAUX DÉPART !</div><div class="reaction-sub">Signal suivant...</div>`;
            updateLiveStats();
            state.waitTimer = setTimeout(nextRound, 680);
          } else if (state.phase === 'go') {
            const rt = Math.max(80, Math.round(performance.now() - state.stimulusStart));
            state.sessionTimes.push(rt);
            beep(880, 0.07, 'sine');
            state.phase = 'idle';
            updateLiveStats();
            if (shouldFinish()) { finishSession(true); return; }
            pad.className = 'reaction-pad';
            pad.innerHTML = `<div class="reaction-big" style="color: var(--accent-2);">${rt} ms</div><div class="reaction-sub">Prochain signal...</div>`;
            state.waitTimer = setTimeout(nextRound, 480);
          }
        }, { passive: false });

        const delay = lvl.minDelay + Math.random() * (lvl.maxDelay - lvl.minDelay);
        state.waitTimer = setTimeout(() => {
          if (!state.running || shouldFinish()) return;
          state.phase = 'go';
          state.stimulusStart = performance.now();
          beep(740, 0.06, 'triangle');
          pad.className = 'reaction-pad go';
          pad.innerHTML = `<div class="reaction-big" style="color: #ecfccb;">TOUCHEZ !</div><div class="reaction-sub">Réaction immédiate</div>`;
        }, delay);
      }

      function runStroopRound() {
        state.phase = 'stroop';
        const wordObj = STROOP_COLORS[Math.floor(Math.random() * STROOP_COLORS.length)];
        let inkObj = STROOP_COLORS[Math.floor(Math.random() * STROOP_COLORS.length)];
        if (state.level !== 'debutant' && inkObj.key === wordObj.key) {
          inkObj = STROOP_COLORS[(STROOP_COLORS.indexOf(inkObj) + 1) % STROOP_COLORS.length];
        }
        state.stroopExpected = inkObj.key;
        const arena = document.getElementById('arena');
        arena.innerHTML = `
          <div class="stroop-top">
            <div class="stroop-rule">COULEUR DE L'ENCRE</div>
            <div class="stroop-word" style="color: ${inkObj.hex};">${wordObj.label}</div>
          </div>
          <div class="thumb-choices">
            ${STROOP_COLORS.map(c => `
              <button class="thumb-btn" data-color="${c.key}">
                <span style="width:13px;height:13px;border-radius:50%;background:${c.hex};display:inline-block;"></span>
                ${c.label}
              </button>
            `).join('')}
          </div>
        `;
        state.stimulusStart = performance.now();
        arena.querySelectorAll('.thumb-btn').forEach(btn => {
          btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            ensureAudio();
            flashArena();
            if (!state.running || state.phase !== 'stroop') return;
            if (btn.dataset.color === state.stroopExpected) {
              state.sessionTimes.push(Math.max(120, Math.round(performance.now() - state.stimulusStart)));
              beep(820, 0.06, 'sine');
              state.phase = 'idle';
              nextRound();
            } else {
              state.errors += 1;
              beep(220, 0.12, 'sawtooth');
              btn.style.borderColor = 'var(--danger)';
              updateLiveStats();
            }
          }, { passive: false });
        });
      }

      function runPeriphRound() {
        state.phase = 'periph';
        const lvl = LEVELS[state.level];
        const size = lvl.grid;
        const total = size * size;
        const centerIdx = size % 2 === 1 ? Math.floor(total / 2) : -1;
        const candidates = [];
        for (let i = 0; i < total; i++) if (i !== centerIdx) candidates.push(i);
        candidates.sort(() => Math.random() - 0.5);
        state.periphSet = new Set(candidates.slice(0, lvl.targets));
        state.periphFound = new Set();

        const arena = document.getElementById('arena');
        arena.innerHTML = `
          <div class="periph-header">
            <span>Fixez le centre <strong>+</strong></span>
            <span id="periphCounter">0 / ${lvl.targets}</span>
          </div>
          <div class="periph-wrap">
            <div class="periph-grid" style="grid-template-columns: repeat(${size}, 1fr);">
              ${Array.from({ length: total }, (_, idx) => {
                if (idx === centerIdx) return `<div class="periph-cell center-fix">+</div>`;
                const isTarget = state.periphSet.has(idx);
                return `<button class="periph-cell ${isTarget ? 'target' : ''}" data-idx="${idx}">${isTarget ? '●' : ''}</button>`;
              }).join('')}
            </div>
          </div>
        `;
        state.stimulusStart = performance.now();
        arena.querySelectorAll('.periph-cell[data-idx]').forEach(cell => {
          cell.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            ensureAudio();
            flashArena();
            if (!state.running || state.phase !== 'periph') return;
            const idx = Number(cell.dataset.idx);
            if (state.periphSet.has(idx) && !state.periphFound.has(idx)) {
              state.periphFound.add(idx);
              cell.classList.remove('target');
              cell.classList.add('hit');
              cell.textContent = '✓';
              beep(760, 0.05, 'sine');
              document.getElementById('periphCounter').textContent = `${state.periphFound.size} / ${state.periphSet.size}`;
              if (state.periphFound.size === state.periphSet.size) {
                state.sessionTimes.push(Math.max(150, Math.round(performance.now() - state.stimulusStart)));
                state.phase = 'idle';
                nextRound();
              }
            } else if (!state.periphSet.has(idx)) {
              state.errors += 1;
              cell.classList.add('miss');
              beep(240, 0.1, 'sawtooth');
              updateLiveStats();
            }
          }, { passive: false });
        });
      }

      function finishSession(completed = true) {
        stopTimers();
        state.running = false;
        state.phase = 'idle';
        setActionButton(false);
        updateLiveStats();

        const times = state.sessionTimes;
        const avg = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : 0;
        const best = times.length ? Math.min(...times) : 0;
        const totalAct = times.length + state.errors;
        const acc = totalAct > 0 ? Math.round((times.length / totalAct) * 100) : 100;
        const score = avg ? Math.round(Math.max(100, 120000 / Math.max(140, avg)) * (0.5 + (acc / 100) * 0.5)) : 0;

        document.getElementById('arena').innerHTML = `
          <div class="reaction-pad" style="cursor: default;">
            <div class="reaction-big" style="color: var(--accent);">${completed && score ? `${score} pts` : 'Session terminée'}</div>
            <div class="reaction-sub">
              Moyenne : <strong>${avg ? avg + ' ms' : '—'}</strong> • Meilleur : <strong>${best ? best + ' ms' : '—'}</strong><br/>
              Précision : <strong>${acc}%</strong> (${times.length} réussites)
            </div>
          </div>
        `;

        if (completed && score > 0 && times.length > 0) {
          const entry = {
            id: String(Date.now()) + '_' + Math.random().toString(36).slice(2, 6),
            name: 'Athlète',
            score,
            avgMs: avg,
            date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })
          };
          const key = getCatKey(state.mode, state.level);
          const current = getTop3(state.mode, state.level).slice();
          current.push(entry);
          current.sort((a, b) => b.score - a.score || a.avgMs - b.avgMs);
          const top3 = current.slice(0, 3);
          const idx = top3.findIndex(item => item.id === entry.id);
          if (idx !== -1) {
            state.podiumData[key] = top3;
            savePodium();
            state.pendingEntryId = entry.id;
            openPodiumModal(state.mode, state.level, true, idx + 1);
          }
        }
      }

      function openPodiumModal(mode = state.mode, level = state.level, isNewRecord = false, pos = 1) {
        state.podiumMode = mode;
        state.podiumLevel = level;
        document.querySelectorAll('#podiumModeTabs .mode-pill').forEach(b => b.classList.toggle('active', b.dataset.pmode === mode));
        document.querySelectorAll('#podiumLevelTabs .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.plevel === level));
        const banner = document.getElementById('recordBanner');
        const input = document.getElementById('newRecordName');
        if (isNewRecord && state.pendingEntryId) {
          const medals = { 1: '🥇 1re place', 2: '🥈 2e place', 3: '🥉 3e place' };
          document.getElementById('recordBannerText').textContent = `🎉 Nouveau record (${medals[pos] || 'Top 3'}) ! Nom de l'athlète :`;
          banner.classList.add('show');
          input.value = '';
          setTimeout(() => input.focus(), 120);
        } else {
          banner.classList.remove('show');
        }
        renderPodiumList();
        document.getElementById('podiumModal').classList.add('open');
      }

      function renderPodiumList() {
        const list = document.getElementById('podiumList');
        const items = getTop3(state.podiumMode, state.podiumLevel);
        const medals = ['🥇', '🥈', '🥉'];
        if (!items.length) {
          list.innerHTML = `<div class="podium-row" style="justify-content: center; color: var(--muted); font-size: 13px;">Aucun score enregistré pour cette catégorie.</div>`;
          return;
        }
        list.innerHTML = items.map((item, idx) => `
          <div class="podium-row rank-${idx + 1}">
            <div class="rank-medal">${medals[idx]}</div>
            <div class="podium-info">
              <div class="podium-name">${item.name.replace(/[<>&"]/g, '')}</div>
              <div class="podium-score">${item.score} pts • Moy. ${item.avgMs} ms (${item.date})</div>
            </div>
            <button class="small-btn" data-rename-id="${item.id}">✏️ Nom</button>
          </div>
        `).join('');
        list.querySelectorAll('[data-rename-id]').forEach(btn => {
          btn.addEventListener('click', () => {
            const key = getCatKey(state.podiumMode, state.podiumLevel);
            const target = (state.podiumData[key] || []).find(x => x.id === btn.dataset.renameId);
            if (!target) return;
            const nextName = prompt('Nom de l’athlète sur le podium :', target.name);
            if (nextName !== null) {
              target.name = nextName.trim().slice(0, 20) || 'Athlète';
              savePodium();
              renderPodiumList();
            }
          });
        });
      }

      document.querySelectorAll('.mode-pill[data-mode]').forEach(btn => btn.addEventListener('click', () => {
        if (state.running) return;
        state.mode = btn.dataset.mode;
        document.querySelectorAll('.mode-pill[data-mode]').forEach(b => b.classList.toggle('active', b === btn));
        renderIdleArena();
      }));

      document.querySelectorAll('#levelGroup .seg-btn').forEach(btn => btn.addEventListener('click', () => {
        if (state.running) return;
        state.level = btn.dataset.level;
        document.querySelectorAll('#levelGroup .seg-btn').forEach(b => b.classList.toggle('active', b === btn));
        renderIdleArena();
      }));

      document.querySelectorAll('#scopeGroup .seg-btn').forEach(btn => btn.addEventListener('click', () => {
        if (state.running) return;
        state.scope = btn.dataset.scope;
        document.querySelectorAll('#scopeGroup .seg-btn').forEach(b => b.classList.toggle('active', b === btn));
        updateLiveStats();
      }));

      document.getElementById('soundBtn').addEventListener('click', () => {
        state.soundOn = !state.soundOn;
        document.getElementById('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';
        if (state.soundOn) { ensureAudio(); beep(660, 0.06, 'sine'); }
      });

      document.getElementById('mainActionBtn').addEventListener('click', () => {
        if (state.running) finishSession(false);
        else startSession();
      });

      document.getElementById('openPodiumBtn').addEventListener('click', () => openPodiumModal(state.mode, state.level, false));
      document.getElementById('closePodiumBtn').addEventListener('click', () => document.getElementById('podiumModal').classList.remove('open'));
      document.getElementById('podiumModal').addEventListener('click', (e) => {
        if (e.target.id === 'podiumModal') document.getElementById('podiumModal').classList.remove('open');
      });

      document.querySelectorAll('#podiumModeTabs .mode-pill').forEach(btn => btn.addEventListener('click', () => {
        state.podiumMode = btn.dataset.pmode;
        document.querySelectorAll('#podiumModeTabs .mode-pill').forEach(b => b.classList.toggle('active', b === btn));
        renderPodiumList();
      }));

      document.querySelectorAll('#podiumLevelTabs .seg-btn').forEach(btn => btn.addEventListener('click', () => {
        state.podiumLevel = btn.dataset.plevel;
        document.querySelectorAll('#podiumLevelTabs .seg-btn').forEach(b => b.classList.toggle('active', b === btn));
        renderPodiumList();
      }));

      function confirmPendingName() {
        if (!state.pendingEntryId) return;
        const clean = document.getElementById('newRecordName').value.trim().slice(0, 20) || 'Athlète';
        const list = state.podiumData[getCatKey(state.mode, state.level)] || [];
        const found = list.find(item => item.id === state.pendingEntryId);
        if (found) { found.name = clean; savePodium(); }
        state.pendingEntryId = null;
        document.getElementById('recordBanner').classList.remove('show');
        renderPodiumList();
      }

      document.getElementById('saveRecordNameBtn').addEventListener('click', confirmPendingName);
      document.getElementById('newRecordName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); confirmPendingName(); }
      });

      document.getElementById('resetCategoryBtn').addEventListener('click', () => {
        if (!confirm('Effacer le podium de cette catégorie ?')) return;
        delete state.podiumData[getCatKey(state.podiumMode, state.podiumLevel)];
        savePodium();
        renderPodiumList();
      });

      savePodium();
      updateLiveStats();
      renderIdleArena();
    })();
  </script>
</body>
</html>
